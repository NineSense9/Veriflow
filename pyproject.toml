[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veriflow"
version = "0.2.0"
description = "验流 Veriflow — 规格驱动的出题工作流验证与受约束自修复"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
veriflow = "veriflow_cli.main:main"

[tool.setuptools.packages.find]
where = [
  "packages/ir",
  "packages/staticcheck",
  "packages/compare",
  "packages/sandbox",
  "packages/mutate",
  "packages/spec",
  "packages/verify",
  "packages/repair",
  "packages/explain",
  "packages/cli",
  "packages/runtime",
  "services/api",
]
include = [
  "veriflow_ir*",
  "veriflow_staticcheck*",
  "veriflow_compare*",
  "veriflow_sandbox*",
  "veriflow_mutate*",
  "veriflow_spec*",
  "veriflow_verify*",
  "veriflow_repair*",
  "veriflow_explain*",
  "veriflow_cli*",
  "veriflow_runtime*",
  "veriflow_api*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "packages/ir",
  "packages/staticcheck",
  "packages/compare",
  "packages/sandbox",
  "packages/mutate",
  "packages/spec",
  "packages/verify",
  "packages/repair",
  "packages/explain",
  "packages/cli",
  "packages/runtime",
  "services/api",
]
