[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veriflow"
version = "0.1.0"
description = "验流 Veriflow — 可验证算法训练平台"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["packages/ir", "packages/staticcheck", "packages/compare", "packages/sandbox", "services/api"]
include = ["veriflow_ir*", "veriflow_staticcheck*", "veriflow_compare*", "veriflow_sandbox*", "veriflow_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/ir", "packages/staticcheck", "packages/compare", "packages/sandbox", "services/api"]
